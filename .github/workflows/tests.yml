#
# Run full tests
#
name: Tests

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Platform(s) to run'
        required: true
        default: 'macos'
        type: choice
        options:
          - macos
          - linux
          - windows
          - all
      test_scope:
        description: 'Test scope for manual runs'
        required: true
        default: 'focused'
        type: choice
        options:
          - focused
          - full
  push:
    branches:
      - master
      - 6.[0-9]+
    paths:
      - 'src/**'
      - 'test/**'
      - 'doc/examples/**'
      - 'doc/scripts/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'doc/examples/**'
      - 'doc/scripts/**'
      - '.github/workflows/tests.yml'

defaults:
  run:
    # default to use bash shell
    shell: bash -el {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    env:
      # directories
      COASTLINEDIR: ${{ github.workspace }}/coastline
      INSTALLDIR: ${{ github.workspace }}/gmt-install-dir
      # disable auto-display of GMT plots
      GMT_END_SHOW: off
      # Run full tests
      BUILD_DOCS  : false
      PACKAGE     : false
      RUN_TESTS   : true

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '[{"name":"Linux","os":"ubuntu-latest"},{"name":"macOS","os":"macos-15-intel"},{"name":"Windows","os":"windows-latest"}]' || inputs.os == 'all' && '[{"name":"Linux","os":"ubuntu-latest"},{"name":"macOS","os":"macos-15-intel"},{"name":"Windows","os":"windows-latest"}]' || inputs.os == 'macos' && '[{"name":"macOS","os":"macos-15-intel"}]' || inputs.os == 'linux' && '[{"name":"Linux","os":"ubuntu-latest"}]' || '[{"name":"Windows","os":"windows-latest"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Setup vcpkg (Windows)
        run: gh run download -n vcpkg-cache -D C:/vcpkg/installed/
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        if: runner.os == 'macOS'

      - name: Install GMT dependencies
        run: |
          # $RUNNER_OS can be Linux, macOS or Windows
          # The following command converts $RUNNER_OS to lowercase
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          bash ci/install-dependencies-${os}.sh
        env:
          EXCLUDE_OPTIONAL: ${{ matrix.EXCLUDE_OPTIONAL }}

      - name: Add Ghostscript registry so that GraphicsMagick can find it [Windows]
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\Software\GPL Ghostscript"
          New-Item -Path "HKLM:\Software\GPL Ghostscript\10.03.0"
          New-ItemProperty -Path "HKLM:\Software\GPL Ghostscript\10.03.0" -Name GS_DLL -PropertyType String -Value "C:\Miniconda\Library\bin\gsdll64.dll"
          New-ItemProperty -Path "HKLM:\Software\GPL Ghostscript\10.03.0" -Name GS_LIB -PropertyType String -Value "C:\Miniconda\Library\bin;C:\Miniconda\Library\lib;C\Miniconda\Library\Font;C:\Miniconda\Library\fonts"
        if: runner.os == 'Windows'

      - name: Download GSHHG and DCW data
        run: gh run download -n coastline-cache -D coastline
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure GMT
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            bash ci/config-gmt-unix.sh
          else
            bash ci/config-gmt-windows.sh
          fi

      - name: Compile GMT (Linux/macOS)
        run: |
          mkdir build
          cd build
          cmake -G Ninja ..
          cmake --build .
        if: runner.os != 'Windows'

      - name: Compile GMT (Windows)
        shell: cmd
        run: |
          mkdir build
          cd build
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -G Ninja .. -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build .
        if: runner.os == 'Windows'

      - name: DVC credentials preflight
        run: |
          if [ -z "${DAGSHUB_TOKEN:-}" ]; then
            echo "::error::Missing DAGSHUB_TOKEN secret."
            echo "::error::Add repository secret DAGSHUB_TOKEN in your fork: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "DVC credential check passed."
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull baseline image data from dvc remote
        run: |
          dvc remote modify origin url https://${DAGSHUB_TOKEN}@dagshub.com/GenericMappingTools/gmt.dvc --local
          dvc pull --no-run-cache
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

      - name: DVC Pull Debug
        if: always()
        run: |
          echo "=== Listing DVC-tracked files ==="
          dvc list . --dvc-only || true
          echo "=== Check for missing files ==="
          dvc status -c || true
          echo "=== Show local cache status ==="
          dvc status || true
          echo "=== Verify key baseline/example/script paths ==="
          ls -ld test/baseline doc/examples/images doc/scripts/images || true
          echo "=== Count pulled images ==="
          find test/baseline -type f | wc -l || true
          find doc/examples/images -type f | wc -l || true
          find doc/scripts/images -type f | wc -l || true

      - name: Install GMT
        run: |
          cd build
          cmake --build . --target install
          # Add GMT PATH to bin
          echo "${INSTALLDIR}/bin" >> $GITHUB_PATH

      - name: Download cached GMT remote data from GitHub Artifacts
        run: gh run download -n gmt-cache -D ~/.gmt/static/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check a few simple commands
        run: bash ci/simple-gmt-tests.sh

      - name: Check a few simple commands (Windows)
        shell: cmd
        run: call ci/simple-gmt-tests.bat
        if: runner.os == 'Windows'

      - name: Keep passing test directories for focused artifact capture
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.test_scope == 'focused'
        run: |
          # gmtest normally deletes passing test directories in cleanup().
          # Replace that deletion line so passing directories are retained.
          sed -i.bak 's/test "$ERROR" -eq 0 -a "$memtrack_err" -eq 0 -a "$valgrind_err" -eq 0 && rm -rf "$exec_dir"/echo "Keeping $exec_dir for focused artifact capture"/' build/test/gmtest
          # Require proof that the cleanup line was replaced.
          if ! grep -q 'Keeping \$exec_dir for focused artifact capture' build/test/gmtest; then
            echo "::error::Failed to patch build/test/gmtest cleanup logic; passing test dirs may be deleted."
            exit 1
          fi
          echo "Patched cleanup lines in build/test/gmtest:"
          grep -n 'Keeping \$exec_dir\|rm -rf "\$exec_dir"' build/test/gmtest || true

      - name: Run full tests
        run: |
          set -x -e
          cd build
          ctest_args=(--output-on-failure --force-new-ctest-process -j4 --timeout 480)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.test_scope }}" == "focused" ]]; then
            ctest_args+=(-R "test/pscoast/oblsuite_N.sh|test/gmtmath/lsfit.sh")
          fi
          # Disable MinGW's path conversion, see #1035.
          if [ "$RUNNER_OS" == "Windows" ]; then export MSYS_NO_PATHCONV=1; fi
          # Run tests
          ctest "${ctest_args[@]}" || ctest "${ctest_args[@]}" --rerun-failed || ctest "${ctest_args[@]}" --rerun-failed
          # show the slowest tests
          sort -k3nr Testing/Temporary/CTestCostData.txt > /tmp/cost.txt
          head -n 30 /tmp/cost.txt | awk 'NF==3 {printf("%50-s %d %5.1f\n", $1, $2, $3)}'

      - name: Preserve focused test outputs before cleanup
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.test_scope == 'focused'
        run: |
          cd build
          mkdir -p preserved_test_outputs
          echo "Checking focused test directories before copy:"
          for test_dir in test/pscoast/oblsuite_N test/gmtmath/lsfit; do
            if [[ -d "$test_dir" ]]; then
              echo "FOUND: $test_dir"
            else
              echo "MISSING: $test_dir"
            fi
          done
          for test_dir in test/pscoast/oblsuite_N test/gmtmath/lsfit; do
            if [[ -d "$test_dir" ]]; then
              cp -r "$test_dir" preserved_test_outputs/
              echo "Preserved: $test_dir"
            fi
          done
          echo "Preserved files:"
          find preserved_test_outputs -maxdepth 3 -type f | sort || true
          ls -la preserved_test_outputs/

      - name: Run DOS batch examples (Windows)
        shell: cmd
        run: |
          cd doc/examples
          call do_examples.bat
        if: runner.os == 'Windows'

      - name: Upload selected test outputs for PS comparison
        uses: actions/upload-artifact@v6
        with:
          name: SelectedTestOutputs-${{ runner.os }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/test/fail_count.txt
            build/preserved_test_outputs/
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch' && inputs.test_scope == 'focused'

      - name: Upload build directory if failed
        uses: actions/upload-artifact@v6
        with:
          name: BuildDirectory-${{ runner.os }}
          path: build/
        if: failure()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.2
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          fail_ci_if_error: false
          gcov: true
        if: always()
